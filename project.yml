name: MacCommander

options:
  bundleIdPrefix: ai.codegear
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W6WJJ8PJPM   # 공식 빌드 서명 Team. 직접 빌드할 때는 본인 Team ID로 바꾼다
    ENABLE_HARDENED_RUNTIME: true

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

targets:
  MacCommander:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Mac Commander
        # About 패널과 메뉴 막대 앱 메뉴는 DisplayName이 아니라 CFBundleName을 쓴다.
        # 지정하지 않으면 타깃명(MacCommander)이 그대로 붙어 나오므로 맞춰 준다.
        CFBundleName: Mac Commander
        # Info.plist는 xcodegen이 생성하므로 버전은 여기서 관리한다.
        # 파일을 직접 고치면 다음 generate에서 덮인다.
        #
        # 버전 규칙 (1.8 다음 릴리스부터 세 자리로 간다):
        #   CFBundleShortVersionString  화면 표시용. major.minor.patch.
        #                               버그 수정 1.8 → 1.8.1 / 기능 추가 1.8 → 1.9.0
        #   CFBundleVersion             빌드 번호. Sparkle이 업데이트 여부를 판단하는
        #                               "유일한" 기준(appcast의 sparkle:version)이다.
        #                               표시 버전 형식과 무관하게 릴리스마다 정수로
        #                               1씩 올린다. 되돌리거나 건너뛰면 안 된다.
        CFBundleShortVersionString: "1.13.7"
        CFBundleVersion: "21"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 CodeGear"
        # Sparkle 자동 업데이트 설정.
        # appcast는 공개 배포 리포(mac-commander-releases)의 최신 릴리스 자산으로 호스팅.
        SUFeedURL: "https://github.com/codegeargit/mac-commander-releases/releases/latest/download/appcast.xml"
        # EdDSA 공개키(generate_keys로 생성). 개인키는 Keychain에 보관하며 커밋하지 않는다.
        SUPublicEDKey: "E2Pp77BaApcmTsjFooty6L2LKFwa4UshwLfP/L+jIoQ="
        # 자동 확인 켜기 + 하루 1회 확인.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.codegear.MacCommander
        PRODUCT_NAME: MacCommander
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
    entitlements:
      path: Sources/MacCommander.entitlements
      properties:
        # App Sandbox 해제 — 임베디드 터미널(셸 프로세스 실행)을 위해 필요.
        # GitHub 직접 배포(Developer ID 서명 + 공증) 전제. App Store 배포 불가.
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true
